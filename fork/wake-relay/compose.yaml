name: storefront-wake

services:
  relay:
    image: node:26-alpine
    # Host networking: magic packets must go out as broadcasts on the VM's LAN.
    network_mode: host
    command: ["node", "/app/relay.ts"]
    environment:
      RELAY_LISTEN: 127.0.0.1:8790
      RELAY_CONFIG: /config/relay.json
      RELAY_STATE: /data/state.json
    volumes:
      - ./relay.ts:/app/relay.ts:ro
      - ./config:/config:ro
      - ./data:/data
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:stable
    # Userspace networking: no tun device and no routes on the VM; only Serve below reaches the relay.
    network_mode: host
    environment:
      TS_USERSPACE: "true"
      TS_HOSTNAME: wake
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /serve/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/serve/serve.json:ro
    restart: unless-stopped

volumes:
  tailscale-state:
